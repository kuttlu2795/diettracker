name: Build Diet Tracker APK

on:
  workflow_dispatch:
  push:
    branches: [ main, deploy ]

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Create local.properties
        run: |
          echo "EDAMAM_APP_ID=" > local.properties
          echo "EDAMAM_APP_KEY=" >> local.properties
          echo "SPOONACULAR_API_KEY=" >> local.properties
          echo "GEMINI_API_KEY=" >> local.properties
          echo "sdk.dir=$ANDROID_SDK_ROOT" >> local.properties

      - name: Build debug APK
        id: build
        shell: bash
        run: ./gradlew assembleDebug --no-daemon --stacktrace > build.log 2>&1; echo "exit=$?" >> $GITHUB_OUTPUT

      - name: Show compile errors
        if: always()
        shell: bash
        run: |
          if [ -f build.log ]; then
            echo "=== ERRORS ===" 
            grep -E "^e:|error:|Unresolved reference|None of the following|overload resolution|is not a subtype" build.log | head -60 || true
            echo "=== LAST 80 LINES ==="
            tail -80 build.log
          fi

      - name: Upload APK artifact
        if: steps.build.outputs.exit == '0'
        uses: actions/upload-artifact@v4
        with:
          name: DietTracker-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Fail if build failed
        if: steps.build.outputs.exit != '0'
        run: exit 1
