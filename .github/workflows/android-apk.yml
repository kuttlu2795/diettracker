name: Build Diet Tracker APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Create local.properties
        run: |
          echo "EDAMAM_APP_ID=" > local.properties
          echo "EDAMAM_APP_KEY=" >> local.properties
          echo "SPOONACULAR_API_KEY=" >> local.properties
          echo "GEMINI_API_KEY=" >> local.properties
          echo "sdk.dir=$ANDROID_SDK_ROOT" >> local.properties

      - name: Build debug APK
        id: build
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}
        continue-on-error: true

      - name: Show errors if build failed
        if: steps.build.outcome == 'failure'
        run: |
          echo "======= BUILD ERRORS ======="
          grep -n "error:\|^e:\|Caused by:\|> Could not\|FAILURE\|Exception\|Unresolved reference\|None of the following" build.log | head -80
          echo "======= LAST 60 LINES ======="
          tail -60 build.log
          exit 1

      - name: Upload APK
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: DietTracker-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
