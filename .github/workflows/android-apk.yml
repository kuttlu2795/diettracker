name: Build Diet Tracker APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Create local.properties with empty API keys
        run: |
          echo "EDAMAM_APP_ID=" > local.properties
          echo "EDAMAM_APP_KEY=" >> local.properties
          echo "SPOONACULAR_API_KEY=" >> local.properties
          echo "GEMINI_API_KEY=" >> local.properties
          echo "sdk.dir=$ANDROID_SDK_ROOT" >> local.properties

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DietTracker-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
