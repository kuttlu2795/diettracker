name: Build Diet Tracker APK

on:
  workflow_dispatch:
  push:
    branches: [ deploy ]

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          echo "EDAMAM_APP_ID=" >> local.properties
          echo "EDAMAM_APP_KEY=" >> local.properties
          echo "SPOONACULAR_API_KEY=" >> local.properties
          echo "GEMINI_API_KEY=" >> local.properties

      - name: Build debug APK
        id: gradle_build
        shell: bash
        run: |
          set +e
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 > build.log
          EXIT=$?
          set -e
          # Post the error to a gist for easy reading
          if [ $EXIT -ne 0 ]; then
            ERRORS=$(grep -E "^e:|error:|Unresolved reference|None of the following candidates|Caused by:|BUILD FAILED|FAILURE:" build.log | head -100)
            TAIL=$(tail -80 build.log)
            GIST_PAYLOAD=$(python3 -c "
import json, sys
content = open('build.log').read()
# Get last 5000 chars
content = content[-5000:]
payload = {'description': 'DietTracker build error', 'public': False, 'files': {'build_error.txt': {'content': content}}}
print(json.dumps(payload))
")
            curl -s -X POST https://api.github.com/gists \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Content-Type: application/json" \
              -d "$GIST_PAYLOAD" | python3 -c "import json,sys; d=json.load(sys.stdin); print('GIST URL:', d.get('html_url','error'))"
            echo "=== ERROR LINES ==="
            echo "$ERRORS"
            echo "=== LAST 80 LINES ==="  
            echo "$TAIL"
            exit $EXIT
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DietTracker-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
