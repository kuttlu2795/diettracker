name: Build Diet Tracker APK

on:
  workflow_dispatch:
  push:
    branches: [ deploy ]

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          echo "EDAMAM_APP_ID=" >> local.properties
          echo "EDAMAM_APP_KEY=" >> local.properties
          echo "SPOONACULAR_API_KEY=" >> local.properties
          echo "GEMINI_API_KEY=" >> local.properties

      - name: Build debug APK
        id: build
        shell: bash
        run: |
          set +e
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 > build.log
          EXIT=$?
          set -e
          if [ $EXIT -ne 0 ]; then
            # Extract kotlin/java compile errors - write to check summary
            ERRORS=$(grep -n "error:\|Unresolved reference\|None of the following\|Not enough information\|Overload resolution" build.log | head -60)
            LAST=$(tail -80 build.log)
            echo "## Build Failed" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "$ERRORS" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "--- LAST 80 LINES ---" >> $GITHUB_STEP_SUMMARY
            echo "$LAST" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            # Also create a gist-like output via check annotation
            echo "errors<<ERREOF" >> $GITHUB_OUTPUT
            echo "$ERRORS" >> $GITHUB_OUTPUT
            echo "ERREOF" >> $GITHUB_OUTPUT
            exit $EXIT
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DietTracker-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
