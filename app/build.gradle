plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.devtools.ksp'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}
// API keys are read from local.properties (which is git-ignored) - never hardcoded here.
// Get free keys at https://developer.edamam.com (Nutrition Analysis API) and
// https://spoonacular.com/food-api (Meal Planner API), then add these three lines
// to your local.properties file:
//   EDAMAM_APP_ID=xxxx
//   EDAMAM_APP_KEY=xxxx
//   SPOONACULAR_API_KEY=xxxx
//   GEMINI_API_KEY=xxxx
def edamamAppId = localProperties.getProperty('EDAMAM_APP_ID', '')
def edamamAppKey = localProperties.getProperty('EDAMAM_APP_KEY', '')
def spoonacularApiKey = localProperties.getProperty('SPOONACULAR_API_KEY', '')
def geminiApiKey = localProperties.getProperty('GEMINI_API_KEY', '')

android {
    namespace 'com.dietary.tracker'
    compileSdk 34

    defaultConfig {
        applicationId "com.dietary.tracker"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }

        buildConfigField "String", "EDAMAM_APP_ID", "\"${edamamAppId}\""
        buildConfigField "String", "EDAMAM_APP_KEY", "\"${edamamAppKey}\""
        buildConfigField "String", "SPOONACULAR_API_KEY", "\"${spoonacularApiKey}\""
        buildConfigField "String", "GEMINI_API_KEY", "\"${geminiApiKey}\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.5.14'
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    // Core
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.2'
    implementation 'androidx.activity:activity-compose:1.9.0'

    // Compose
    implementation platform('androidx.compose:compose-bom:2024.06.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    // Navigation
    implementation 'androidx.navigation:navigation-compose:2.7.7'

    // Room
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    ksp 'androidx.room:room-compiler:2.6.1'

    // Networking
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    // Image loading
    implementation 'io.coil-kt:coil-compose:2.6.0'

    // ML Kit (on-device, no Firebase config required)
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'
    implementation 'com.google.mlkit:text-recognition:16.0.0'

    // CameraX
    def camerax_version = "1.3.4"
    implementation "androidx.camera:camera-core:${camerax_version}"
    implementation "androidx.camera:camera-camera2:${camerax_version}"
    implementation "androidx.camera:camera-lifecycle:${camerax_version}"
    implementation "androidx.camera:camera-view:${camerax_version}"

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    // Wearable sync - Health Connect (reads steps/weight/calories written by companion apps,
    // e.g. boAt Wearables, Fitbit, Galaxy Wearable, if they sync to Health Connect on-device).
    // Check https://developer.android.com/health-and-fitness/guides/health-connect/setup for
    // the latest version if this fails to resolve.
    implementation 'androidx.health.connect:connect-client:1.1.0-alpha07'

    // Testing
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation platform('androidx.compose:compose-bom:2024.06.00')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
}
